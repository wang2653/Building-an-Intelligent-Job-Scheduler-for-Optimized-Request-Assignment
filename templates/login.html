<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body class="login-body">
    <div class="login-box">
        <h2>Login</h2>
        % if defined('error') and error:
        <div style="color: #ffb4b4; font-size: 13px; margin-bottom: 10px; text-align: center; width: 250px;">
            {{error}}
        </div>
        % end
        % if defined('success') and success:
        <div style="color: #b4ffb4; font-size: 13px; margin-bottom: 10px; text-align: center; width: 250px;">
            {{success}}
        </div>
        % end
        <form method="post" action="/login">
            <div class="input-box">
                <label>Account</label>
                <input type="text" name="username" required>
            </div>
            <div class="input-box">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <div class="btn-box">
                <a href="#">Forget Password?</a>
                <div>
                    <button type="submit" name="action" value="signin">Sign In</button>
                    <button type="submit" name="action" value="signup">Sign Up</button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
